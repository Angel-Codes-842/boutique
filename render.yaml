services:
  - type: web
    name: boutique-pos
    runtime: docker
    plan: free
    rootDir: boutique-app
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FACTPY_ENABLED
        value: "false"
      - key: FACTPY_API_URL
        value: https://api.factpy.com
      - key: FACTPY_ENVIRONMENT
        value: test
      - key: FACTPY_TIMEOUT_MS
        value: "10000"
      - key: FACTPY_RECORD_ID
        sync: false
